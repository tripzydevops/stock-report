name: Supabase Migration CI & Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate_migrations.py'
      - '.github/workflows/supabase_migrations.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate_migrations.py'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Perform dry-run verification only (true/false)'
        required: true
        default: 'true'

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-validate:
    name: Lint & Validate SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint Migration Files
        run: python scripts/validate_migrations.py

  staging-verification:
    name: Staging Dry-Run & Schema Diff
    needs: lint-and-validate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Against Staging DB (if credentials provided)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
          STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$STAGING_PROJECT_ID" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "🔍 Linking staging project $STAGING_PROJECT_ID..."
            supabase link --project-ref "$STAGING_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
            supabase db push --dry-run
            echo "✅ Staging migration dry-run completed successfully!"
          else
            echo "ℹ️ Staging credentials not configured. Migration static linting and safety check passed."
          fi

  deploy-production:
    name: Deploy to Production Database
    needs: lint-and-validate
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production' && github.event.inputs.dry_run == 'false')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'erzxltcalghadzfevfjx' }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "🚀 Linking production project $PROJECT_ID and deploying migrations..."
            supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
            supabase db push --password "$SUPABASE_DB_PASSWORD"
            echo "✅ Production Supabase migrations deployed successfully!"
          else
            echo "ℹ️ SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD secret not set. Migrations validated; skipping remote db push."
          fi
