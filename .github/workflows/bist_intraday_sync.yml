name: MarketPulse BIST 30-Minute Intraday Sync

on:
  schedule:
    # Runs every 30 minutes during BIST trading hours: 10:00 - 18:00 TRT (UTC+3) -> 07:00 - 15:00 UTC (Mon-Fri)
    - cron: '*/30 7-15 * * 1-5'
  # Allows manual execution on demand from the Actions tab
  workflow_dispatch:

concurrency:
  group: bist-intraday-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  intraday-sync:
    name: Sync BIST Delayed Prices & Check Stop-Losses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Lightweight Sync Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx supabase python-dotenv

      - name: Execute BIST Intraday 30m Sync
        env:
          PYTHONIOENCODING: utf-8
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python backend/scripts/sync_bist_intraday.py
