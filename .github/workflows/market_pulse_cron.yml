name: MarketPulse Automated Cloud Sync

on:
  schedule:
    # 10:15 TRT (UTC+3) -> 07:15 UTC (Mon-Fri 15 mins after BIST open)
    - cron: '15 7 * * 1-5'
    # 16:45 TRT (UTC+3) -> 13:45 UTC (Mon-Fri 15 mins after US open)
    - cron: '45 13 * * 1-5'
    # 18:15 TRT (UTC+3) -> 15:15 UTC (Mon-Fri after BIST close)
    - cron: '15 15 * * 1-5'
    # 23:15 TRT (UTC+3) -> 20:15 UTC (Mon-Fri after US close)
    - cron: '15 20 * * 1-5'
  # Allows triggering manually from the GitHub Actions tab anytime
  workflow_dispatch:

concurrency:
  group: market-pulse-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-sync:
    name: Execute Market Extraction & Supabase Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install openpyxl xlsxwriter

      - name: Execute MarketPulse Extraction & Sync
        env:
          PYTHONIOENCODING: utf-8
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python export_to_spreadsheet.py
          python backend/scripts/sync_live_catalysts.py

      - name: Upload Latest Spreadsheet as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPulse_Latest_Spreadsheet
          path: MarketPulse_*.xlsx
          retention-days: 30
          if-no-files-found: warn
